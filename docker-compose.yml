services:
  # -------------------------------------------------------------
  # PostgreSQL Database
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: localdepth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-localdepth}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/src/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-localdepth}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - localdepth-network

  # -------------------------------------------------------------
  # Redis (Cache & Async Queues)
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: localdepth-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - localdepth-network

  # -------------------------------------------------------------
  # Meilisearch (Fast Search Engine)
  # -------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: localdepth-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-localdepth_meili_master_key_change_in_production}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - localdepth-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  meilisearch_data:

networks:
  localdepth-network:
    driver: bridge
